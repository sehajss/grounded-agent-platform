[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "grounded-agent-platform"
version = "0.1.0"
description = "A grounded retrieval and policy-controlled developer agent platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "groq>=0.13,<2",
  "langgraph>=0.2.60,<2",
  "numpy>=1.26,<3",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "pyjwt[crypto]>=2.9,<3",
  "sentence-transformers>=3.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true